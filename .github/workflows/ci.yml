name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 5 * * 1" }]
  workflow_dispatch:
jobs:
  foundry:
    name: Foundry labs (01–45)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
        env:
          MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
  hardhat:
    name: Hardhat bonus lab (H1)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hardhat } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: npm ci
      - run: npx hardhat test
  noir:
    name: Noir ZK labs (N1–N4)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: noir } }
    steps:
      - uses: actions/checkout@v7
      - uses: noir-lang/noirup@v0.1.5
        with: { toolchain: 1.0.0-rc.2 }
      - run: nargo fmt --check
      - run: nargo test
  cairo:
    name: Cairo / Starknet labs (C1–C4)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cairo } }
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
        with: { scarb-version: "2.20.1" }
      - run: scarb fmt --check
      - run: scarb test
