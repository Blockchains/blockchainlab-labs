name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 5 * * 1" }]
  workflow_dispatch:
jobs:
  foundry:
    name: Foundry labs (01–45)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
        env:
          MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
  hardhat:
    name: Hardhat bonus lab (H1)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hardhat } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx hardhat test
